<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13263D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="المرتبات">
<title>مرتبات السنتر التعليمي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Aref+Ruqaa:wght@700&display=swap">
<style>
/* Layout: navy brand band on top, tabs below; attendance = employee list + month grid + Fridays panel */
:root{
  --side:#13263D; --side-2:#1B3350; --side-ink:#DDE8F3; --side-muted:#8FA6BE;
  --band:#13263D; --band-ink:#FFFFFF; --band-grad:linear-gradient(118deg,#27C6EE 0%,#2FD8BC 100%); --on-grad:#06263A;
  --g1:#1BB8DE; --g2:#2FD8BC; --cyan:#16B9E6; --mint:#2FD9BA; --accent:#0B84A8; --accent-ink:#FFFFFF;
  --bg:#F2F5F8; --surface:#FFFFFF; --surface-2:#F0F4F8;
  --ink:#14233A; --muted:#62738A; --line:#E0E7EE;
  --friday:#E8F7F3; --friday-ink:#0A7461;
  --ok:#0E8A5C; --warn:#C26A00; --bad:#D03A4B;
  --c1:#0EA5E9; --c2:#10B981; --c3:#F59E0B; --c4:#8B5CF6;
  --shadow:0 12px 32px rgba(19,38,61,.10); --shadow-sm:0 2px 8px rgba(19,38,61,.06);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --side:#0A1522; --side-2:#13243A; --side-ink:#DDE8F3; --side-muted:#7F95AD;
  --accent:#36CDEE; --accent-ink:#06202D; --on-grad:#06263A;
  --bg:#0E1A28; --surface:#142335; --surface-2:#1A2C42;
  --ink:#E6F0F8; --muted:#93A8BC; --line:#24384F;
  --friday:#0F302C; --friday-ink:#5EE6C9;
  --ok:#3FD39A; --warn:#F2B04A; --bad:#FF7B88;
  --shadow:0 12px 32px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --side:#0A1522; --side-2:#13243A; --side-ink:#DDE8F3; --side-muted:#7F95AD;
  --accent:#36CDEE; --accent-ink:#06202D; --on-grad:#06263A;
  --bg:#0E1A28; --surface:#142335; --surface-2:#1A2C42;
  --ink:#E6F0F8; --muted:#93A8BC; --line:#24384F;
  --friday:#0F302C; --friday-ink:#5EE6C9;
  --ok:#3FD39A; --warn:#F2B04A; --bad:#FF7B88;
  --shadow:0 12px 32px rgba(0,0,0,.35); --shadow-sm:0 2px 8px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;direction:rtl}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;flex:1 1 260px;min-width:0}
.brand img{width:56px;height:56px;border-radius:14px;flex:none}
.brand h1{font-family:var(--f-display);font-size:1.35rem;margin:0;line-height:1.2}
.brand p{margin:2px 0 0;opacity:.75;font-size:.85rem}
.period{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:12px;padding:6px}
.period button{background:transparent;border:0;color:var(--band-ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:1.1rem}
.period button:hover{background:rgba(255,255,255,.12)}
.period .lbl{min-width:190px;text-align:center}
.period .lbl b{display:block;font-family:var(--f-display);font-size:1rem}
.period .lbl span{font-size:.8rem;opacity:.75}
.role{font-size:.8rem;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,var(--cyan),var(--mint));color:#0B2233;font-weight:600}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:18px;overflow-x:auto}
.tab{background:none;border:0;padding:10px 16px;cursor:pointer;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{padding-block:18px 48px}
.notice{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-top:14px;font-size:.9rem;color:var(--muted)}
.notice b{color:var(--ink)}
.grid-att{display:grid;grid-template-columns:230px minmax(0,1fr) 290px;gap:18px;align-items:start}
@media (max-width:1050px){.grid-att{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.panel h2{font-family:var(--f-display);font-size:1rem;margin:0 0 10px}
.emp-list{display:flex;flex-direction:column;gap:6px}
@media (max-width:1050px){.emp-list{flex-direction:row;overflow-x:auto;padding-bottom:4px}}
.emp{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:right;background:transparent;border:1px solid transparent;border-radius:10px;padding:8px 10px;cursor:pointer;min-width:150px}
.emp:hover{background:var(--surface-2)}
.emp[aria-pressed="true"]{background:var(--surface-2);border-color:var(--accent)}
.emp .n{font-weight:600}
.emp .s{font-size:.78rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sheet-head h2{margin:0;font-family:var(--f-display);font-size:1.2rem}
.sheet-head .sub{color:var(--muted);font-size:.85rem}
.stats{display:flex;gap:18px;flex-wrap:wrap}
.stat small{display:block;color:var(--muted);font-size:.75rem}
.stat b{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{font-size:.78rem;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr.fri td{background:var(--friday)}
tr.fri .day{color:var(--friday-ink);font-weight:700}
td .day{font-weight:600}
td .dt{font-size:.78rem;color:var(--muted)}
input.t,input.n{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 6px;width:104px}
input.n{width:82px}
input.n.wide{width:100px}
input:disabled{opacity:.6}
.hm{font-size:.75rem;color:var(--muted);margin-inline-start:4px}
.sign{border:1px dashed var(--accent);background:transparent;color:var(--accent);border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:.82rem}
.sign:hover{background:var(--surface-2)}
.signed{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--ok);font-weight:600}
.signed button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0 4px}
.fri-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.fri-list li{display:flex;justify-content:space-between;background:var(--friday);color:var(--friday-ink);padding:6px 10px;border-radius:8px;font-size:.88rem;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:2rem;line-height:1;margin:4px 0 12px;font-variant-numeric:tabular-nums}
.big small{font-size:.9rem;color:var(--muted);font-family:var(--f-body)}
.field{display:flex;flex-direction:column;gap:4px;margin-top:10px}
.field label{font-size:.8rem;color:var(--muted)}
.field input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;width:100%}
.btn{border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:1.1rem;margin-bottom:6px}
.net{font-weight:700;color:var(--ok)}
.neg{color:var(--bad)}
td.num{font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;background:var(--surface-2)}
.addemp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.addemp input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;flex:1 1 180px;min-width:0}
.set-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;align-items:start}
.hint{color:var(--muted);font-size:.84rem;margin:8px 0 0}
.items{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.item-row input,.item-row select,.field textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px}
.item-row input{flex:1 1 140px;min-width:0}
.field textarea{width:100%;resize:vertical}
.checks{display:flex;flex-direction:column;gap:6px}
.own-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.own-row{display:flex;align-items:center;gap:10px;padding:7px 10px;border-top:1px solid var(--line);background:var(--surface)}
.own-row:first-child{border-top:0}
.own-row.off{background:var(--surface-2)}.own-nm::placeholder{color:var(--muted);opacity:.55}
.own-row.edited{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}.own-l small{margin-inline-start:4px}.own-row.off .own-l{opacity:.55}
.own-n{width:22px;text-align:center;color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;flex:none}
.own-l{flex:1;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer}
.own-l small{color:var(--muted);font-size:.75rem}
.own-nm{width:170px;flex:none;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);color:inherit;font:inherit;font-size:.88rem}
.own-mv{display:flex;gap:4px;flex:none;width:64px;justify-content:flex-end}
.icon-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-size:.7rem;display:grid;place-items:center}
.icon-btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.icon-btn:disabled{opacity:.3;cursor:default}
.own-prev{margin-top:12px;overflow:auto;border-radius:12px;background:#E6EBF0;padding:14px;max-height:75vh}
.own-prev .paper{zoom:.78;box-shadow:0 2px 10px rgba(0,0,0,.08)}
@media (max-width:700px){.own-row{flex-wrap:wrap}.own-nm{width:100%;order:3}}
.rlab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.rlab{display:flex;flex-direction:column;gap:4px}.rlab small{color:var(--muted);font-size:.78rem}.rlab input{width:100%}
.checks label{display:flex;gap:8px;align-items:center;cursor:pointer}
.paper td.off{color:#B26A00;font-weight:600;background:#FFF6E8}
.groups{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.grp{display:flex;justify-content:space-between;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 16px;cursor:pointer;text-align:right}
.grp b{font-family:var(--f-display);font-size:1.02rem}
.grp span{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grp[aria-pressed="true"]{border-color:var(--accent);background:var(--surface-2)}
.grp[aria-pressed="true"] b{color:var(--accent)}
.chk{border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:10px;padding:6px 18px;cursor:pointer;font-weight:700;min-width:96px}
.chk:hover{border-color:var(--accent)}
.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mbanner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.mbanner b{display:block}
.mbanner span{font-size:.84rem;color:var(--muted)}
.mbanner.due{border-color:var(--warn)}
.mbanner.closed{border-color:var(--ok);background:var(--surface-2)}
.hist{background:var(--surface);color:var(--ink);border-radius:12px;max-width:760px;margin:0 auto;padding:18px}
.hist h3{font-family:var(--f-display);margin:0 0 4px}
.pill{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.ok{color:var(--ok)}
.paper table.owner{font-size:.9rem;margin-top:6px}
.paper table.owner td,.paper table.owner th{padding:8px 6px}
.paper table.owner tbody tr:nth-child(even) td{background:#F5F8FB}
.paper table.owner tfoot td{background:#2B3E55;color:#fff;font-weight:700;font-size:1rem}
.btn.danger{background:var(--bad);color:#fff}
.btn.danger.armed{outline:3px solid var(--bad);outline-offset:2px;animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{opacity:.8}}
.danger-zone{border-color:var(--bad)}
.lockcell{border:1px dashed var(--line);background:var(--surface-2);color:var(--muted);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.lockcell.wide{width:100%;padding:8px}
.lockbtn{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:var(--band-ink);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.8rem}
.pinbox{background:var(--surface);color:var(--ink);border-radius:14px;max-width:340px;margin:12vh auto 0;padding:20px;display:flex;flex-direction:column;gap:8px}
.pinbox h3{margin:0;font-family:var(--f-display)}
.pinbox input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px;font-size:1.3rem;text-align:center;letter-spacing:.3em}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px}
.bgrid label{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.linkbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:.8rem;text-decoration:underline}
.sigprev{border:1px dashed var(--line);border-radius:10px;padding:10px;background:#fff;display:flex;justify-content:center;min-height:70px;align-items:center}
.sigprev img{max-height:70px;max-width:100%}
.loanh{background:color-mix(in srgb,var(--warn) 14%,var(--surface-2))}
.warnc{color:var(--warn);font-weight:700}
.loanbox{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px;background:var(--surface-2)}
.loanbox h3{margin:0 0 6px;font-size:.95rem;font-family:var(--f-display)}
.loanbox .lrow{display:flex;justify-content:space-between;font-size:.86rem;padding:2px 0;font-variant-numeric:tabular-nums}
.leavebtn{border:1px dashed var(--warn);background:transparent;color:var(--warn);border-radius:8px;padding:4px 10px;cursor:pointer;font-weight:600;font-size:.82rem}
.leavebtn:hover{background:var(--surface-2)}
.leavechip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:700;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:8px;padding:3px 10px}
.leavechip button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:.9rem;padding:0 2px}
.side-stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.scard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.sc-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.sc-head h2{margin:0;font-family:var(--f-display);font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc-head .count{color:var(--muted);font-size:.85rem}.sc-head .count b{font-family:var(--f-display);font-size:1.5rem;color:var(--ink);margin-inline-end:2px}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill-d{background:var(--friday);color:var(--friday-ink);border-radius:999px;padding:4px 11px;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.kv label{display:flex;flex-direction:column;font-weight:600;font-size:.9rem}
.kv label small{font-weight:400;color:var(--muted);font-size:.74rem}
.kv input,.kv .lockcell{width:96px;text-align:center;flex:none}
.sc-foot{margin-top:4px;padding-top:9px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.sc-foot b{color:var(--ink)}
.tag{font-size:.74rem;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.tag.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent)}
.loan-tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tile{background:var(--surface-2);border-radius:12px;padding:8px 10px}
.tile small{display:block;color:var(--muted);font-size:.72rem}
.tile b{font-family:var(--f-display);font-size:1.15rem;font-variant-numeric:tabular-nums}
.tile.hot b{color:var(--warn)}
.side-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.settle{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:14px;padding:16px 18px;border-radius:16px;border:2px dashed var(--accent);background:var(--surface)}
.settle .stxt{flex:1 1 240px;min-width:0}.settle b{display:block;font-family:var(--f-display);font-size:1.05rem}.settle small{color:var(--muted)}
.settle.done{border:2px solid var(--ok);background:color-mix(in srgb,var(--ok) 8%,var(--surface))}
.settle .sico{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:#fff;font-weight:700;font-size:1.2rem;flex:none}
.btn.big{padding:12px 22px;font-size:1rem}
.okdot{font-style:normal;color:var(--ok);font-weight:700;margin-inline-end:4px}
tr.settled-row td{background:color-mix(in srgb,var(--ok) 6%,transparent)}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:10px;font-size:.9rem;z-index:50}
/* report modal */
.modal{position:fixed;inset:0;background:rgba(10,18,28,.6);z-index:40;overflow:auto;padding:24px max(12px,env(safe-area-inset-right,0px)) 24px max(12px,env(safe-area-inset-left,0px))}
.modal-bar{max-width:820px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.modal-bar .row{gap:6px}
.paper{max-width:820px;margin:0 auto;background:#fff;color:#1B2838;border-radius:6px;padding:28px 30px;font-family:var(--f-body);direction:rtl;letter-spacing:0}
@media (max-width:600px){.paper{padding:16px 12px}}
.paper .rp-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #2B3E55;padding-bottom:12px}
.paper .rp-head img{width:70px;height:70px;border-radius:14px}
.paper h3{font-family:var(--f-display);margin:0;font-size:1.3rem;color:#2B3E55}
.paper .meta{color:#5B6B7D;font-size:.85rem}
.paper .info{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:14px 0}
.paper .info div{background:#EEF4F8;border-radius:8px;padding:6px 10px}
.paper .info small{display:block;color:#5B6B7D;font-size:.72rem}
.paper .info b{font-size:.98rem}
.paper table{font-size:.82rem}
.paper th{background:#2B3E55;color:#fff;position:static}
.paper td,.paper th{border:1px solid #CBD6E0;padding:3px 6px;text-align:center;line-height:1.35}
.paper tr.fri td{background:#E2FAF4}

.paper .sum td{text-align:right}

/* ===== layout: side navigation ===== */
body{background:var(--bg)}
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.sidenav{background:var(--side);color:var(--side-ink);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;gap:6px;padding:20px 14px}
.sidenav .brand{flex:none;display:flex;align-items:center;gap:12px;padding:4px 6px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:8px}
.sidenav .brand img{width:52px;height:52px;border-radius:14px;flex:none;box-shadow:0 0 0 2px rgba(255,255,255,.12)}
.sidenav h1{font:700 1.12rem var(--f-display);margin:0;color:#fff}
.sidenav .brand p{margin:2px 0 0;font-size:.76rem;color:var(--side-muted)}
.nav-label{margin:12px 8px 4px;font-size:.72rem;color:var(--side-muted);font-weight:600}
.tabs{display:flex;flex-direction:column;gap:3px;border:0;margin:0;overflow:visible}
.tab{display:flex;align-items:center;gap:12px;width:100%;text-align:right;padding:11px 12px;border-radius:12px;border:0;color:var(--side-ink);font-weight:600;background:transparent}
.tab svg,.grp svg{width:20px;height:20px;flex:none}
.tab:hover{background:var(--side-2)}
.tab[aria-selected="true"]{background:var(--band-grad);color:var(--on-grad);box-shadow:0 6px 18px rgba(39,198,238,.25)}
svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.groups{display:flex;flex-direction:column;gap:6px;margin:0}
.grp{display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:10px 12px;border-radius:12px;border:1px solid rgba(255,255,255,.08);background:transparent;color:var(--side-ink);cursor:pointer}
.grp .gi{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--side-2);color:#7DE3F7;font-style:normal;flex:none}
.grp b{display:flex;flex-direction:column;flex:1;font-size:.9rem}
.grp b small{font:400 .7rem var(--f-body);color:var(--side-muted)}
.grp span{font-size:.72rem;color:var(--side-muted);white-space:nowrap}
.grp[aria-pressed="true"]{border-color:#2FD8BC;background:rgba(47,216,188,.10)}
.grp[aria-pressed="true"] .gi{background:var(--band-grad);color:var(--on-grad)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08)}
.lockbtn{border:1px solid rgba(255,255,255,.15);background:var(--side-2);color:var(--side-ink);border-radius:10px;padding:9px 12px;cursor:pointer;font-weight:600;text-align:right}
.role{align-self:flex-start;background:rgba(47,216,188,.15);color:#7DF0DA;border-radius:999px;padding:4px 12px;font-size:.78rem;font-weight:600}
.content{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar h2{margin:0;font:700 1.35rem var(--f-display)}
.topbar p{margin:2px 0 0;color:var(--muted);font-size:.84rem}
.period{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:5px}
.period button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface);color:var(--ink);cursor:pointer;font-size:1.1rem;box-shadow:var(--shadow-sm)}
.period .lbl{min-width:200px;text-align:center}.period .lbl b{display:block;font:700 1rem var(--f-display)}.period .lbl span{font-size:.76rem;color:var(--muted)}
.content .wrap{max-width:1400px;width:100%;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
main{padding-block:20px 48px}
.strip{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.strip-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.strip-h h2{margin:0;font:700 1rem var(--f-display)}.strip-h span{color:var(--muted);font-size:.8rem}
.strip .emp-list{display:flex;flex-direction:row;gap:8px;overflow-x:auto;padding-bottom:4px}
.strip .emp{flex:none;min-width:170px;display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface)}
.strip .emp .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.emp .av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font:700 .95rem var(--f-display);color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 35) 58% 42%))}
.strip .emp[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--g1) 8%,var(--surface))}
.grid-att2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.att-lay{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;align-items:start}
.elist{position:sticky;top:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;max-height:calc(100vh - 120px);overflow:hidden}

.elist-h h2{margin:0;font:700 1rem var(--f-display)}
.elist-h span{font-size:.78rem;font-weight:700;color:var(--accent);background:var(--surface-2);border-radius:999px;padding:2px 10px}
.elist-q{padding:0 12px 8px}.elist-q input{width:100%}
.elist-b{overflow-y:auto;padding:4px 8px 10px;display:flex;flex-direction:column;gap:3px}

.erow:hover{background:var(--surface-2)}
.erow[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 11%,var(--surface))}
.erow[aria-pressed="true"]::before{content:'';position:absolute;right:-8px;top:8px;bottom:8px;width:4px;border-radius:4px;background:var(--accent)}
.erow .av{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;font:700 .95rem var(--f-display);color:#fff;background:linear-gradient(135deg,hsl(var(--h) 62% 50%),hsl(calc(var(--h) + 35) 58% 42%))}
.erow .nm{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}

.erow .nm small{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.erow .okdot{flex:none}

.panel,.scard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm)}
.stats{gap:10px}

.scroll{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);background:var(--surface)}
th{background:var(--surface-2);color:var(--muted)}
tbody tr:hover td{background:color-mix(in srgb,var(--g1) 5%,transparent)}
tr.fri td{background:var(--friday)}

.btn{background:var(--accent);color:#fff;border-radius:10px;padding:9px 16px}

.btn.danger{background:var(--bad);color:#fff}

.leavebtn{border-radius:999px;border-style:solid}
.signed{background:color-mix(in srgb,var(--ok) 11%,transparent);border-radius:999px;padding:3px 10px}
.chk{border-radius:999px}.chk.on{background:var(--ok);border-color:var(--ok);color:#fff}
.mbanner{border-radius:16px;box-shadow:var(--shadow-sm)}

.notice{border-radius:14px;margin-top:16px}

.modal{backdrop-filter:blur(3px);z-index:60}

.set-link{display:flex;align-items:center;gap:10px;width:100%;text-align:right;border:0;background:transparent;color:var(--muted);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600}

.set-head{margin-bottom:14px}.set-head h2{margin:0;font:700 1.25rem var(--f-display)}.set-head p{margin:4px 0 0;color:var(--muted)}
.set-body{display:flex;flex-direction:column;gap:14px;max-width:760px}
.set-body .scard h3{margin:0 0 10px;font:700 1rem var(--f-display)}
.set-body .scard .kv:first-of-type{border-top:0}
.set-body>.panel>h2{display:none}
.set-body>.panel{padding:16px 18px}
.checks.two{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px 16px}
.set-body .kv input.n{width:120px}
@media (max-width:860px){.set-layout{grid-template-columns:minmax(0,1fr)}.set-nav{position:static;flex-direction:row;overflow-x:auto}.set-link{width:auto;white-space:nowrap}}
@media (max-width:1100px){.grid-att2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:860px){

  .side-foot{flex-direction:row;align-items:center;justify-content:space-between;border-top:0;padding-top:4px}
  .topbar{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

  .period{width:100%;justify-content:space-between}.period .lbl{min-width:0}
}

const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const $=s=>document.querySelector(s);
const initialOf=n=>{const s=String(n||'?').trim().replace(/^(أ|ا|م|د|ك)\s*[\/.]\s*/,'').trim();const w=(s.split(/\s+/)[0]||'').replace(/[\u0640]/g,'');return /^[اأإآ]/.test(w)?w.slice(0,2):(w.charAt(0)||'?')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(v);return isFinite(n)?n:0};
const money=v=>(Math.round(v*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const fmtH=h=>{const t=Math.round(h*60);const H=Math.floor(t/60),M=t%60;return H+'س'+(M?' '+M+'د':'')};
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());

// ---------- period: 26 of previous month -> 25 of key month ----------
function keyFor(d){let y=d.getFullYear(),m=d.getMonth();if(d.getDate()>25){m++;if(m>11){m=0;y++}}return y+'-'+pad(m+1)}
function shiftKey(k,n){let[y,m]=k.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+pad(m)}
function periodDays(k){const[y,m]=k.split('-').map(Number);const s=new Date(y,m-2,26),e=new Date(y,m-1,25),out=[];for(let d=new Date(s);d<=e;d.setDate(d.getDate()+1))out.push(new Date(d));return out}
function periodName(k){const[y,m]=k.split('-').map(Number);const p=new Date(y,m-2,1);return 'مرتب '+MONTHS[m-1]+' '+y}
function periodRange(k){const ds=periodDays(k);const a=ds[0],b=ds[ds.length-1];return 'من '+a.getDate()+' '+MONTHS[a.getMonth()]+' إلى '+b.getDate()+' '+MONTHS[b.getMonth()]+' '+b.getFullYear()}

const S={isOwner:false,canSettings:false,canEmps:true,setSec:'calc',payAll:{},unlocked:savedUnlock,group:savedGroup,key:keyFor(new Date()),tab:'att',sel:null,emps:{},general:{},monthCfg:{},monthState:{},att:{},pay:{},
  db:null,user:null,me:null,isAdmin:false,canWrite:true,live:false,names:{}};

// ---------- storage ----------
let unsubMonth=[];
const queues={};
function write(path,patch){
  if(!S.db){applyLocal(path,patch);render();return}
  const q=queues[path]||(queues[path]={patch:{},timer:null,busy:false});
  deepMerge(q.patch,patch);applyLocal(path,patch);render();
  clearTimeout(q.timer);q.timer=setTimeout(()=>flush(path),500);
}
async function flush(path){
  const q=queues[path];if(!q||q.busy)return;const patch=q.patch;if(!Object.keys(patch).length)return;
  q.patch={};q.busy=true;q.fly=patch;
  try{
    const ref=S.db.doc(path);
    try{await ref.update(patch)}catch(e){if(e&&e.code==='invalid_argument'){const cur=await ref.get();if(cur.exists)throw e;await ref.set(patch)}else throw e}
  }catch(e){toast(e&&e.code==='invalid_argument'?'مش مسموح لك تعدّل هنا':'ما اتحفظش، جرّب تاني');console.warn(e)}
  q.busy=false;q.fly=null;if(Object.keys(q.patch).length)flush(path);
}
async function remove(path){if(S.db){try{await S.db.doc(path).delete()}catch(e){toast('ما اتمسحش')}}const[c,id]=path.split('/');const m=mapFor(c,id);if(m)delete m[id];render()}
function deepMerge(t,s){for(const k in s){if(s[k]&&typeof s[k]==='object'&&!Array.isArray(s[k])){t[k]=t[k]&&typeof t[k]==='object'?t[k]:{};deepMerge(t[k],s[k])}else t[k]=s[k]}return t}
function mapFor(c,id){if(c==='employees')return S.emps;if(c==='att')return S.att;if(c==='pay')return S.pay;if(c==='config'){return null}return null}
function applyLocal(path,patch){
  const[c,id]=path.split('/');
  if(c==='config'){if(id==='general')deepMerge(S.general,patch);else if(id==='m_'+S.key)deepMerge(S.monthCfg,patch);return}
  if(c==='months'){if(id===S.key)deepMerge(S.monthState,patch);return}
  const m=mapFor(c,id);if(!m)return;m[id]=deepMerge(JSON.parse(JSON.stringify(m[id]||{})),patch);
  if(c==='pay')S.payAll[id]=JSON.parse(JSON.stringify(m[id]));
}

// ---------- derived ----------
const attId=(emp,k=S.key)=>k+'_'+emp;
const fridays=k=>periodDays(k).filter(d=>d.getDay()===5);
const snapOn=()=>!!(S.monthCfg&&S.monthCfg.closed&&S.monthCfg.snap);
const eff=()=>snapOn()?S.monthCfg.snap:S.general;
const isClosed=()=>!!(S.monthState.closed||(S.monthCfg&&S.monthCfg.closed));
function fridayHours(){return snapOn()?num(S.monthCfg.snap.fridayHours):num(S.monthCfg.fridayHours ?? S.general.fridayHours ?? 0)}
const rawRate=id=>{const r=(eff().rates||{})[id];return r!==undefined&&r!==''?r:((S.general.rates||{})[id]??'')};
const empPay=id=>S.pay[attId(id)]||{};
const settledOf=id=>!!(empPay(id).settled||(S.att[attId(id)]||{}).settled);
const esnap=id=>{const p=empPay(id);return p.settled&&p.snap?p.snap:null};
function rateOf(emp){const z=esnap(emp);return z&&z.rate!==undefined?num(z.rate):num(rawRate(emp))}
const rateVal=id=>rawRate(id);
// per-employee Friday hours; empty = use the month/general default
const fhVal=id=>{const a=(eff().fhs||{})[id];if(a!==undefined&&a!=='')return a;return (S.general.fhs||{})[id]??''};
const fhOf=id=>{const z=esnap(id);if(z&&z.fh!==undefined)return num(z.fh);const v=fhVal(id);return v!==''&&v!==undefined?num(v):fridayHours()};
const fhInput=(id,iid)=>`<input ${settledOf(id)?'disabled':''} class="n" type="number" min="0" step="0.5" id="${iid}" data-fh="${id}" value="${fhVal(id)}" placeholder="${fridayHours()}" style="width:70px" ${isClosed()?'disabled':''}>`;

}

function morph(a,b){
  if(a.nodeType!==b.nodeType||a.nodeName!==b.nodeName){a.replaceWith(b);return}
  if(a.nodeType===3||a.nodeType===8){if(a.nodeValue!==b.nodeValue)a.nodeValue=b.nodeValue;return}
  if(a.nodeType!==1)return;
  for(const at of [...a.attributes])if(!b.hasAttribute(at.name))a.removeAttribute(at.name);
  for(const at of [...b.attributes])if(a.getAttribute(at.name)!==at.value)a.setAttribute(at.name,at.value);
  const tag=a.nodeName;
  if(tag==='INPUT'){if(a.type==='checkbox'||a.type==='radio'){if(a.checked!==b.checked)a.checked=b.checked}else if(a!==document.activeElement&&a.value!==b.value&&a.type!=='file')a.value=b.value;return}
  if(tag==='TEXTAREA'){if(a!==document.activeElement&&a.value!==b.value)a.value=b.value;return}
  const ac=[...a.childNodes],bc=[...b.childNodes];
  for(let i=0;i<bc.length;i++){if(i<ac.length)morph(ac[i],bc[i]);else a.appendChild(bc[i])}
  for(let i=bc.length;i<ac.length;i++)ac[i].remove();
  if(tag==='SELECT'){const v=[...b.options].find(o=>o.selected||o.hasAttribute('selected'));if(v&&a.value!==v.value&&a!==document.activeElement)a.value=v.value}
}
function setView(sel,html){
  const el=$(sel);if(!el.firstChild){el.innerHTML=html;return}
  const t=document.createElement(el.nodeName);t.innerHTML=html;
  const ac=[...el.childNodes],bc=[...t.childNodes];
  for(let i=0;i<bc.length;i++){if(i<ac.length)morph(ac[i],bc[i]);else el.appendChild(bc[i])}
  for(let i=bc.length;i<ac.length;i++)ac[i].remove();
}

const OWN_NAMES={num:'م',name:'اسم الموظف',type:'النوع',work:'الشغل',gross:'المرتب',basic:'الأساسي',adv:'السلف',loanDed:'خصم السلفة (−)',loanLeft:'باقي السلفة',oth:'خصومات',net:'الصافي',note:'ملاحظة',total:'الإجمالي',capHour:'موظفين بالساعة',capDay:'موظفين بالشهر',cGross:'إجمالي المرتبات',cAdv:'إجمالي السلف',cOth:'خصومات تانية',cNet:'المطلوب صرفه'};

const OWN_ORDER_DEF=['type','work','gross','adv','loanLeft','oth','net','note'];
function ownOrder(O){const o=(Array.isArray(O.colOrder)?O.colOrder:[]).filter(k=>OWN_ORDER_DEF.includes(k));return[...o,...OWN_ORDER_DEF.filter(k=>!o.includes(k))]}
function ownEmpOrder(O){
  const all=Object.entries(S.emps).filter(([,e])=>!e.archived).sort((a,b)=>(grpOf(a[1])===grpOf(b[1])?0:grpOf(a[1])==='hour'?-1:1)||(a[1].name||'').localeCompare(b[1].name||'','ar'));
  const ord=Array.isArray(O.order)?O.order:[];if(!ord.length)return all;

}

  let tables;

  else tables=table(rows);
  const K=O.cards;const cards=[K.gross?`<div><small>${ON(O,'cGross')}</small><b>${money(T.gross)} ج</b></div>`:'',K.adv?`<div><small>${ON(O,'cAdv')}</small><b>${money(T.adv)} ج</b></div>`:'',K.oth&&T.oth>0.0001?`<div><small>${ON(O,'cOth')}</small><b>${money(T.oth)} ج</b></div>`:'',K.net?`<div style="background:#2B3E55;color:#fff"><small style="color:#cfd9e3">${ON(O,'cNet')}</small><b>${money(T.net)} ج</b></div>`:''].join('');

async function deleteEmp(id){
  if(S.db){
    const a=await S.db.collection('att').where('emp','==',id).get();const p=await S.db.collection('pay').where('emp','==',id).get().catch(()=>({docs:[]}));
    for(const d of a.docs)await S.db.doc('att/'+d.id).delete();
    for(const d of p.docs)await S.db.doc('pay/'+d.id).delete();
    await S.db.doc('employees/'+id).delete();
  }
  for(const k in S.att)if(S.att[k].emp===id||k.endsWith('_'+id))delete S.att[k];
  for(const k in S.pay)if(S.pay[k].emp===id||k.endsWith('_'+id))delete S.pay[k];
  delete S.emps[id];if(S.sel===id)S.sel=null;
}

// one A4 page per canvas: shrink to fit; long content (owner sheet with many rows) may split when allowSplit
function addFit(pdf,c,first,allowSplit){
  const W=210,H=297,mg=8,mw=W-2*mg,mh=H-2*mg;const natH=c.height*mw/c.width;
  if(natH<=mh||!allowSplit||natH<=mh*1.35){
    const sc=Math.min(1,mh/natH),w=mw*sc,h=natH*sc;if(!first)pdf.addPage();
    pdf.addImage(c.toDataURL('image/jpeg',.92),'JPEG',(W-w)/2,mg,w,h);return}
  const pageHpx=c.width*mh/mw;let y=0;
  while(y<c.height){const sl=document.createElement('canvas');sl.width=c.width;sl.height=Math.min(pageHpx,c.height-y);sl.getContext('2d').drawImage(c,0,y,c.width,sl.height,0,0,c.width,sl.height);
    if(!(first&&y===0))pdf.addPage();pdf.addImage(sl.toDataURL('image/jpeg',.92),'JPEG',mg,mg,mw,sl.height*mw/c.width);y+=pageHpx}
}

  else if(t.dataset.ownabc)write('config/general',{owner:{order:[]}});

  else if(t.dataset.rlabreset){write('config/general',{rlabels:Object.fromEntries(Object.keys(RLAB_DEF).map(k=>[k,'']))});toast('رجعت المسميات الأصلية')}
  else if(t.dataset.signone)write('config/general',{sigImg:''});
  else if(t.dataset.batch)openBatch();
  else if(t.dataset.ball){document.querySelectorAll('.bchk').forEach(c=>c.checked=true);bCount()}
  else if(t.dataset.bnone){document.querySelectorAll('.bchk').forEach(c=>c.checked=false);bCount()}
  else if(t.dataset.bsel){const g=t.dataset.bsel;document.querySelectorAll('.bchk').forEach(c=>{if(grpOf(S.emps[c.value]||{})===g)c.checked=true});bCount()}
  else if(t.id==='bPdf')batchPDF();
  else if(t.id==='bHtml')batchHTML();
  else if(t.dataset.reopen){write('config/m_'+S.key,{closed:false});write('months/'+S.key,{closed:false});toast('الشهر اتفتح للتعديل')}
  else if(t.dataset.itdel!==undefined){const arr=items().filter((_,i)=>i!==+t.dataset.itdel);write('config/general',{items:arr})}
  else if(t.dataset.arch){const id=t.dataset.arch;write('employees/'+id,{archived:!S.emps[id].archived})}
  else if(t.id==='closeM')$('#modal').hidden=true;
  else if(t.id==='pdfBtn')savePDF();

});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')$('#modal').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').hidden=true});
function parseT(v){v=String(v||'').trim().replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[.,،؛;\s-]/g,':');if(!v)return '';
  let h,m;if(v.includes(':')){[h,m]=v.split(':');m=m||'0'}else if(v.length<=2){h=v;m='0'}else{h=v.slice(0,-2);m=v.slice(-2)}
  h=+h;m=+m;if(!isFinite(h)||!isFinite(m)||h>23||m>59||h<0||m<0)return null;return pad(h)+':'+pad(m)}
function diffH(a,b){const[ah,am]=a.split(':').map(Number),[bh,bm]=b.split(':').map(Number);const i=ah*60+am;let o=bh*60+bm,m=o-i;
  if(m<0&&o<720&&o+720>i)m+=720;if(m<0)m+=1440;return Math.round(m/60*100)/100}
document.addEventListener('input',e=>{if(e.target.id==='empSearch'){S.q=e.target.value;render()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('bchk')){bCount();return}
  if(t.dataset.d){const d=t.dataset.d,f=t.dataset.f,cur=((S.att[attId(S.sel)]||{}).days||{})[d]||{};if(f!=='h'){const n=parseT(t.value);if(n===null){toast('اكتب الوقت كده: 8 أو 8:30 أو 830');t.value=cur[f]||'';return}t.value=n}const row={[f]:f==='h'?(t.value===''?'':num(t.value)):t.value};
    if(f!=='h'){const i=f==='in'?t.value:cur.in,o=f==='out'?t.value:cur.out;if(i&&o)row.h=diffH(i,o)}
    write('att/'+attId(S.sel),{month:S.key,emp:S.sel,days:{[d]:row}})}
  else if(t.dataset.fh){write('config/general',{fhs:{[t.dataset.fh]:t.value===''?'':num(t.value)}})}
  else if(t.dataset.rate!==undefined&&t.dataset.rate){write('config/general',{rates:{[t.dataset.rate]:t.value===''?'':num(t.value)}})}
  else if(t.id==='rate-side'){write('config/general',{rates:{[S.sel]:t.value===''?'':num(t.value)}})}
  else if(t.id==='fh'||t.id==='fh2'){const v=t.value===''?'':num(t.value);write('config/m_'+S.key,{fridayHours:v});if(v!=='')write('config/general',{fridayHours:v})}
  else if(t.dataset.item){write('pay/'+attId(t.dataset.pay),{month:S.key,emp:t.dataset.pay,items:{[t.dataset.item]:t.value===''?'':num(t.value)}})}
  else if(t.id==='s-pin'){const v=t.value.trim();if(!v){toast('الرقم السري ما ينفعش يبقى فاضي');t.value=pinOf();return}write('config/general',{pin:v});toast('الرقم السري اتغير')}
  else if(t.id==='s-fh')write('config/general',{fridayHours:t.value===''?'':num(t.value)});
  else if(t.id==='s-ld')write('config/general',{leaveDays:num(t.value)});
  else if(t.id==='s-lh')write('config/general',{leaveHours:num(t.value)});
  else if(t.id==='sigFile'&&t.files&&t.files[0]){loadSig(t.files[0]);t.value=''}
  else if(t.id==='s-signer')write('config/general',{signer:t.value.trim()});
  else if(t.id==='s-warn')write('config/general',{warnings:t.value});
  else if(t.id==='delSel'){S.delSel=t.value;delConfirm=null;render()}
  else if(t.dataset.rep)write('config/general',{report:{[t.dataset.rep]:t.checked}});
  else if(t.dataset.rlab){write('config/general',{rlabels:{[t.dataset.rlab]:t.value.trim()}});toast('اتغيّر المسمى')}
  else if(t.dataset.own){const [a,b]=t.dataset.own.split('.');write('config/general',{owner:b?{[a]:{[b]:t.checked}}:{[a]:t.checked}})}
  else if(t.dataset.ownhide)write('config/general',{owner:{hide:{[t.dataset.ownhide]:!t.checked}}});
  else if(t.dataset.ownnet){const id=t.dataset.ownnet;write('pay/'+attId(id),{month:S.key,emp:id,ownerNet:t.value===''?'':num(t.value)});toast(t.value===''?'رجع للمحسوب':'اتعدّل المبلغ في الكشف')}
  else if(t.dataset.ownname)write('config/general',{owner:{names:{[t.dataset.ownname]:t.value.trim()}}});
  else if(t.dataset.owntxt)write('config/general',{owner:{[t.dataset.owntxt]:t.value}});
  else if(t.dataset.it!==undefined){const arr=items().map(x=>({...x}));const i=+t.dataset.it;if(arr[i]){arr[i][t.dataset.k]=t.dataset.k==='name'?(t.value.trim()||arr[i].name):t.value;write('config/general',{items:arr})}}
  else if(t.dataset.pay){const f=t.dataset.f;write('pay/'+attId(t.dataset.pay),{month:S.key,emp:t.dataset.pay,[f]:(f==='note'||f==='bonusWhy')?t.value.trim():(t.value===''?'':num(t.value))})}
  else if(t.dataset.empF){write('employees/'+t.dataset.id,{[t.dataset.empF]:t.value.trim()});if(t.dataset.empF==='type')toast(t.value==='day'?'اتنقل لموظفين بالشهر':'اتنقل لموظفين بالساعة')}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='pinForm'){e.preventDefault();const v=$('#pinIn').value.trim();
    if(v===pinOf()){$('#modal').hidden=true;setUnlocked(true);toast('الأسعار ظهرت')}else{$('#pinErr').textContent='الرقم السري غلط';$('#pinIn').value='';$('#pinIn').focus()}return}
  if(e.target.id==='itemForm'){e.preventDefault();const n=$('#newItem').value.trim();if(!n)return;
    const arr=items().map(x=>({...x}));arr.push({id:'i'+Date.now().toString(36),name:n,kind:$('#newKind').value,unit:$('#newUnit').value});
    write('config/general',{items:arr});toast('اتضاف بند '+n);return}
  if(e.target.id!=='addForm')return;e.preventDefault();
  const n=$('#newName').value.trim();if(!n)return;
  const id='e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  write('employees/'+id,{name:n,job:$('#newJob').value.trim(),type:S.group,archived:false,created:new Date().toISOString()});
  S.sel=id;toast('اتضاف '+n);
});
function closeMonth(){
  const snap={rates:JSON.parse(JSON.stringify(S.general.rates||{})),fhs:JSON.parse(JSON.stringify(S.general.fhs||{})),fridayHours:fridayHours(),leaveDays:leaveDays(),leaveHours:leaveHours(),items:JSON.parse(JSON.stringify(items()))};
  const at=new Date().toISOString();
  write('config/m_'+S.key,{closed:true,closedAt:at,snap});write('months/'+S.key,{closed:true,closedAt:at});toast('اتقفل '+periodName(S.key)+' واتحفظ');

function loadSig(f){
  const fr=new FileReader();fr.onload=()=>{const img=new Image();img.onload=()=>{
    const sc=Math.min(1,520/img.width,200/img.height),w=Math.round(img.width*sc),h=Math.round(img.height*sc);
    const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.drawImage(img,0,0,w,h);
    const d=x.getImageData(0,0,w,h),p=d.data;for(let i=0;i<p.length;i+=4){const l=(p[i]+p[i+1]+p[i+2])/3;if(l>235)p[i+3]=0;else if(l>120)p[i+3]=Math.round((235-l)*255/115)}
    x.putImageData(d,0,0);const url=c.toDataURL('image/png');
    if(url.length>200000){toast('الصورة كبيرة، جرّب صورة أصغر');return}
    write('config/general',{sigImg:url});toast('اتغيرت صورة الإمضاء')};img.onerror=()=>toast('ما قدرتش أقرا الصورة');img.src=fr.result};fr.readAsDataURL(f);
}
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2400)}

// ---------- names of signers ----------
async function resolveNames(){
  if(!S.user)return;const ids=new Set();for(const a of Object.values(S.att))for(const r of Object.values(a.days||{}))if(r.by&&r.by!=='local')ids.add(r.by);
  if(!ids.size)return;const ps=await S.user.profiles([...ids]);let ch=false;
  for(const id of ids){const n=ps[id]?.name||'';if(n&&S.names[id]!==n){S.names[id]=n;ch=true}}
  if(ch&&S.tab==='att')renderAtt();
}

// ---------- subscriptions ----------
function subMonth(){
  unsubMonth.forEach(u=>u());unsubMonth=[];if(!S.db){S.monthCfg={};S.monthState={};return}
  S.att={};S.pay={};S.monthCfg={};S.monthState={};const key=S.key;
  unsubMonth.push(S.db.doc('months/'+key).onSnapshot(s=>{if(key!==S.key)return;const v=snapDoc('months/'+key,s);if(same(v,S.monthState))return;S.monthState=v;softRender()},err));
  unsubMonth.push(S.db.collection('att').where('month','==',key).onSnapshot(s=>{if(key!==S.key)return;const m=snapMap('att',s);if(same(m,S.att))return;S.att=m;softRender();resolveNames()},err));
  if(S.isAdmin){
    unsubMonth.push(S.db.collection('pay').where('month','==',key).onSnapshot(s=>{if(key!==S.key)return;const m=snapMap('pay',s);if(same(m,S.pay))return;S.pay=m;softRender()},err));
    unsubMonth.push(S.db.doc('config/m_'+key).onSnapshot(s=>{if(key!==S.key)return;const v=snapDoc('config/m_'+key,s);if(same(v,S.monthCfg))return;S.monthCfg=v;softRender()},err));
  }
}
// snapshots: keep what the user is still typing, skip identical data, and draw at most once per frame
function pend(c,id){const q=queues[c+'/'+id];if(!q)return null;const o={};if(q.fly)deepMerge(o,q.fly);deepMerge(o,q.patch);return Object.keys(o).length?o:null}
function snapMap(c,s){const m={};s.docs.forEach(d=>{const x=JSON.parse(JSON.stringify(d.data()));const p=pend(c,d.id);m[d.id]=p?deepMerge(x,JSON.parse(JSON.stringify(p))):x});
  for(const k in queues){const[cc,id]=k.split('/');if(cc===c&&!m[id]){const p=pend(c,id);if(p&&(c!=='att'&&c!=='pay'||p.month===S.key||(S[c]||{})[id]))m[id]=JSON.parse(JSON.stringify(p))}}return m}
function snapDoc(path,s){const x=s.exists?JSON.parse(JSON.stringify(s.data())):{};const[c,id]=path.split('/');const p=pend(c,id);return p?deepMerge(x,JSON.parse(JSON.stringify(p))):x}
let rq=0;const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function softRender(){if(rq)return;rq=requestAnimationFrame(()=>{rq=0;render()})}
function err(e){console.warn(e);if(e&&e.code==='revoked')S.canWrite=false}

render();
(async()=>{
  const c=window.claude;
  if(!c||!c.use){setMode(false);return}
  const [db,user]=await Promise.all([c.use('db').catch(()=>null),c.use('user').catch(()=>null)]);
  S.db=db;S.user=user;
  if(user){S.me=await user.id();const own=await user.isOwner();S.isOwner=own;const w=await user.can('data.write');
    const P=user.perms?await user.perms():null;
    if(P){S.isAdmin=own||!!P.pay;S.canSettings=own||!!P.settings;S.canEmps=own||!!P.emps||!!P.pay;S.canWrite=own||!!P.att||!!P.pay}
    else{S.isAdmin=own;S.canSettings=own;S.canWrite=w!==false;S.canEmps=S.canWrite}}
  setMode(!!db);
  if(db){
    if(S.isAdmin)db.collection('pay').onSnapshot(s=>{const m=snapMap('pay',s);if(same(m,S.payAll))return;S.payAll=m;softRender()},err);
    db.collection('employees').onSnapshot(s=>{const m=snapMap('employees',s);if(same(m,S.emps))return;S.emps=m;softRender()},err);
    if(S.isAdmin||S.canSettings)db.doc('config/general').onSnapshot(s=>{const v=snapDoc('config/general',s);if(same(v,S.general))return;S.general=v;softRender()},err);
    subMonth();
  }
  render();
})();
function setMode(live){
  S.live=live;
  if(!live){S.isAdmin=true;S.canWrite=true;S.isOwner=true;S.canSettings=true;S.canEmps=true}
  $('#roleChip').textContent=!live?'وضع تجربة':S.isOwner?'صاحب البرنامج':S.isAdmin?'المرتبات':S.canSettings?'الإعدادات':S.canWrite?'مسؤول الحضور':S.canEmps?'الموظفين':'عرض فقط';
  $('#notice').innerHTML=live?(S.canWrite?'':'<div class="notice"><b>عرض فقط.</b> حسابك مش مفعّل للتسجيل، كلّم صاحب البرنامج.</div>')
    :'';
  render();
}
